name: Dependabot auto-merge

# Turns on auto-merge (or merges when auto-merge is unavailable) for Dependabot
# patch and minor updates only. Major updates are left for a human.
# Uses only the gh CLI that ships on the runner, so it needs no third-party
# action and works under an organization Actions allowlist.
on:
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Label and queue patch or minor updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # Dependabot records each update's semver level in its commit message.
          types=$(gh pr view "$PR_URL" --json commits --jq '.commits[].messageBody' \
            | grep -oE 'update-type: version-update:semver-[a-z]+' | sort -u || true)
          if [ -z "$types" ]; then
            echo "No update-type metadata found. Leaving this PR for a human."
            exit 0
          fi
          if echo "$types" | grep -qvE 'semver-(patch|minor)$'; then
            echo "Contains a major or unknown update. Leaving this PR for a human."
            exit 0
          fi
          gh pr edit "$PR_URL" --add-label "automerge-minor-patch" || {
            gh label create "automerge-minor-patch" --description "Dependabot patch or minor update eligible for auto-merge" --color "0E8A16" || true
            gh pr edit "$PR_URL" --add-label "automerge-minor-patch"
          }
          if gh pr merge --auto --squash "$PR_URL"; then
            echo "Auto-merge enabled."
            exit 0
          fi
          echo "Auto-merge is not available on this repository. The scheduled job will merge once checks pass."

  merge-green:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge labeled Dependabot PRs whose checks passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$REPO" --author "app/dependabot" --label "automerge-minor-patch" --state open --json number,url --jq '.[].url')
          if [ -z "$prs" ]; then
            echo "No eligible open PRs."
            exit 0
          fi
          for url in $prs; do
            echo "Considering $url"
            if gh pr checks "$url" >/tmp/checks.txt; then
              gh pr merge --squash "$url"
              echo "Merged $url"
            else
              echo "Checks not all green for $url:"
              cat /tmp/checks.txt || true
            fi
          done
