name: Baseline check

# Runs on every push and pull request to main. Uses no third-party actions,
# so it works under the organization's "pinned and approved actions only" policy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run baseline check
        run: bash scripts/check-baseline.sh
